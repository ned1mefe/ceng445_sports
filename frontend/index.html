<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports Management System</title>

    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <!-- jQuery UI CSS -->
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/ui-lightness/jquery-ui.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
            font-weight: bold;
        }

        .status.connected {
            background: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .section {
            margin-bottom: 40px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .section h2 {
            color: #495057;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-weight: bold;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }

        select[multiple] {
            height: 120px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-warning:hover {
            background: #e0a800;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
            margin: 2px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #17a2b8;
            color: white;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        .game-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #888;
            border-radius: 8px;
            width: 80%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #000;
        }

        table {
            width: 100%;
        }

        .dataTables_wrapper {
            margin-top: 20px;
        }

        .status-ended {
            color: #721c24;
            background: #f8d7da;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-running {
            color: #155724;
            background: #d4edda;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-scheduled {
            color: #856404;
            background: #fff3cd;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .status-paused {
            color: #0c5460;
            background: #d1ecf1;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🏆 Sports Management System</h1>
        <div id="status" class="status disconnected">Disconnected</div>

        <!-- Teams Section -->
        <div class="section">
            <h2>Teams</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="teamName" placeholder="Enter team name">
                </div>
                <div class="form-group">
                    <label>Year</label>
                    <input type="number" id="teamYear" placeholder="e.g., 2024">
                </div>
                <div class="form-group">
                    <label>Country</label>
                    <input type="text" id="teamCountry" placeholder="Enter country">
                </div>
            </div>
            <button onclick="createTeam()">Create Team</button>
            <div id="teamsTable"></div>
        </div>

        <!-- Games Section -->
        <div class="section">
            <h2>Games</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Home Team</label>
                    <select id="gameHomeTeam"></select>
                </div>
                <div class="form-group">
                    <label>Away Team</label>
                    <select id="gameAwayTeam"></select>
                </div>
                <div class="form-group">
                    <label>Date & Time</label>
                    <input type="datetime-local" id="gameDateTime">
                </div>
            </div>
            <button onclick="createGame()">Create Game</button>
            <div id="gamesTable"></div>
        </div>

        <!-- Cups Section -->
        <div class="section">
            <h2>Cups</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>Cup Type</label>
                    <select id="cupType">
                        <option value="ELIMINATION">Elimination</option>
                        <option value="GROUP">Group</option>
                        <option value="LEAGUE">League</option>
                        <option value="ELIMINATION2">Elimination (with rematch)</option>
                        <option value="GROUP2">Group (with rematch)</option>
                        <option value="LEAGUE2">League (with rematch)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Interval (days)</label>
                    <input type="number" id="cupInterval" value="1" min="1">
                </div>
                <div class="form-group" style="grid-column: 1 / -1;">
                    <label>Teams (Hold Ctrl/Cmd to select multiple)</label>
                    <select id="cupTeams" multiple></select>
                </div>
            </div>
            <button onclick="createCup()">Create Cup</button>
            <div id="cupsTable"></div>
        </div>
    </div>

    <!-- Modal for Game Stats/Controls -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeGameModal()">&times;</span>
            <h2 id="modalTitle">Game Details</h2>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- jQuery UI -->
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
    <!-- DataTables -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>

    <script src="app.js"></script>
</body>

</html>
